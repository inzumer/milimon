name: Deploy to GitHub Pages

# Staging = dev: every approved change is live in a few minutes. Production (own domain) will deploy main.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://inzumer.github.io
      # GitHub Pages serves the site under the repository name, so the base follows it (a
      # rename needs no code change). With a custom domain, set BASE_PATH to /.
      BASE_PATH: /${{ github.event.repository.name }}
      # Public by design (they end up in the static bundle); set them as repository variables.
      PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
      PUBLIC_GTM_AUTH: ${{ vars.PUBLIC_GTM_AUTH }}
      PUBLIC_GTM_PREVIEW: ${{ vars.PUBLIC_GTM_PREVIEW }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_API_KEY: ${{ vars.PUBLIC_API_KEY }}
      PUBLIC_API_APP_ID: ${{ vars.PUBLIC_API_APP_ID }}
      PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
      PUBLIC_FACEBOOK_APP_ID: ${{ vars.PUBLIC_FACEBOOK_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Accessibility audit
        run: pnpm audit:a11y

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
