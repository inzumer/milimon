name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # The weekly release runs this same validation on its release branch.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: inzumer/inzumer-ci/.github/workflows/node-ci.yml@v1
    with:
      ref: ${{ inputs.ref || github.ref }}
      commands: |
        pnpm audit --audit-level moderate
        pnpm typecheck
        pnpm lint
        pnpm format:check
        pnpm spellcheck
        pnpm test:coverage
        pnpm build
        pnpm audit:a11y
