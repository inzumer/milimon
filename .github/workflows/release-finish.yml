name: Release finish

# After a release/* PR lands on main: tag vX.Y.Z, publish the GitHub Release, merge main back
# into dev and delete the branch. Runs when someone merges the PR by hand, and from release.yml
# after an automatic merge (merges made with GITHUB_TOKEN don't trigger other workflows, so that
# path also starts the Pages deploy itself).
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      deploy:
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  finish:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version || github.event.pull_request.head.ref }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tag and publish the GitHub Release
        run: |
          VERSION="${VERSION#release/}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag

      - name: Merge main back into dev
        run: |
          git checkout -B dev origin/dev
          if ! git merge-base --is-ancestor origin/main dev; then
            git merge --no-ff origin/main -m "Merge branch 'release/$VERSION' into dev"
            git push origin dev || gh pr create --base dev --head main \
              --title "chore(release): merge v$VERSION back into dev" \
              --body "dev is protected: merge this PR to bring the release back."
          fi
          git push origin --delete "release/$VERSION" 2>/dev/null || true

      - name: Deploy
        if: inputs.deploy
        run: gh workflow run pages.yml --ref main
