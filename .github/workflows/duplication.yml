name: Duplicated code

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  duplication:
    uses: inzumer/inzumer-ci/.github/workflows/duplication.yml@v1
    with:
      paths: src scripts
      ignore: '**/*.json,**/*.md,**/*.mdoc,**/*.yaml,**/i18n/**,**/__tests__/**'
