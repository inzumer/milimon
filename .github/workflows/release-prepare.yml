name: Release prepare

# Fridays at noon (Madrid): if `dev` has changes since the last tag, cut `release/X.Y.Z` (version
# from Conventional Commits), open the PR to `main` and run CI on it. It is merged on Monday by
# release-publish.yml. With no changes, stale release PRs are closed.
on:
  schedule:
    # GitHub schedules are UTC only: 10:00 UTC is noon in summer (CEST), 11:00 UTC in winter (CET).
    # The gate job keeps the one that matches Madrid's current offset.
    - cron: '0 10 * * 5'
    - cron: '0 11 * * 5'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = from Conventional Commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Only at noon in Madrid
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(node -p "const d=new Date();const m=+new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',hour:'numeric',hourCycle:'h23'}).format(d);12-((m-d.getUTCHours()+24)%24)")
          [ "$(echo "$SCHEDULE" | cut -d' ' -f2)" = "$hour" ] && run=true || run=false
          echo "run=$run" >> "$GITHUB_OUTPUT"

  plan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Plan
        id: plan
        env:
          RELEASE_REF: origin/dev
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
        run: node .github/scripts/release-plan.mjs

      - name: Close previous release PRs
        env:
          COMMENT: "${{ steps.plan.outputs.release == 'true' && 'Replaced by a newer release.' || 'No changes since the last release, closed automatically.' }}"
        run: |
          gh pr list --state open --base main --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/")) | .number' |
          while read -r number; do
            gh pr close "$number" --delete-branch --comment "$COMMENT"
          done

      - name: Cut the release branch and open the PR
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git push origin --delete "release/$VERSION" 2>/dev/null || true
          git checkout -b "release/$VERSION"
          npm version "$VERSION" --no-git-tag-version
          git commit -am "chore(release): $VERSION"
          git push -u origin "release/$VERSION"
          {
            cat release-notes.md
            printf '\n\n---\nSe fusiona automáticamente el lunes al mediodía (Madrid) si el CI pasa.\n'
          } > pr-body.md
          gh pr create --base main --head "release/$VERSION" \
            --title "chore(release): $VERSION" --body-file pr-body.md

  validate:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: release/${{ needs.plan.outputs.version }}
